name: SpendSmart CI

on:
  push:
    branches: [main, fix/finance-logic-audit]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: CI=true npm test -- --watchAll=false --runInBand
      - name: Production build
        run: npm run build
