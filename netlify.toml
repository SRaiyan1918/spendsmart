[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"
  PUBLIC_URL = ""
  REACT_APP_FIREBASE_EMULATORS = "false"
  REACT_APP_FIREBASE_PROJECT_ID = "spend-smart-eb084"

# The worker verifies file digests. Keep published HTML and assets unchanged.
[build.processing]
  skip_processing = true

[[headers]]
  for = "/sw-budget.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
